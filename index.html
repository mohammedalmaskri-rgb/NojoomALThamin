<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>محاكاة 3D — إنبات بذور الفول</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#07131f;color:#eef8ff;font-family:Tahoma,Arial,sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;inset:0;pointer-events:none}
.top{position:absolute;top:12px;right:12px;left:12px;display:flex;justify-content:space-between;gap:8px}
.card{background:#0b2135dd;border:1px solid #2b79a8;border-radius:14px;padding:10px 14px;box-shadow:0 8px 25px #0008;backdrop-filter:blur(8px)}
.title{font-weight:bold;font-size:16px}
.bottom{pointer-events:auto;position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:min(960px,calc(100% - 20px));display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
.control{min-width:190px;flex:1}
label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;color:#cdeaff}
input[type=range]{width:100%}
button{border:1px solid #3488ba;border-radius:10px;background:#12344f;color:white;padding:9px 13px;font-weight:bold}
button.on{background:#176944}
.note{position:absolute;top:70px;right:12px;width:min(280px,42vw);font-size:12px;line-height:1.7}
.badge{color:#7ff2aa;font-weight:bold}
@media(max-width:650px){.note{font-size:10px;width:210px}.title{font-size:13px}.bottom{gap:6px}.control{min-width:140px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui">
 <div class="top">
  <div class="card title">🌱 محاكاة 3D — إنبات بذور الفول</div>
  <div class="card">اليوم: <b id="dayOut">1.0</b> / 7</div>
 </div>
 <div class="card note">
  <b>فكرة التجربة</b><br>
  بذور فول منقوعة بين <span class="badge">ورقة ماصة</span> وجانب علبة شفافة، مع كمية قليلة من الماء.<br>
  حرّك الزمن لمشاهدة خروج <b>الجذر إلى الأسفل</b> ثم نمو <b>الساق إلى الأعلى</b>.<br>
  اسحب المشهد بإصبعك لتدويره، وقرّب بإصبعين.
 </div>
 <div class="card bottom">
   <div class="control"><label><span>مرور الأيام</span><b id="dayVal">1.0</b></label><input id="day" type="range" min="0" max="7" value="1" step=".1"></div>
   <div class="control"><label><span>كمية الماء</span><b id="waterVal">60%</b></label><input id="water" type="range" min="0" max="100" value="60"></div>
   <div><button id="play">▶ تشغيل النمو</button> <button id="reset">↺ إعادة</button></div>
 </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const canvas=document.getElementById('c');
const R=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
R.setPixelRatio(Math.min(devicePixelRatio,2)); R.shadowMap.enabled=true;
R.setSize(innerWidth,innerHeight); R.outputEncoding=THREE.sRGBEncoding;
const S=new THREE.Scene(); S.background=new THREE.Color(0x081521);
const C=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,500); C.position.set(34,25,44);
const O=new THREE.OrbitControls(C,R.domElement); O.target.set(0,9,0); O.enableDamping=true; O.enablePan=false;
S.add(new THREE.HemisphereLight(0xbde7ff,0x16202a,1.15));
const dl=new THREE.DirectionalLight(0xfff0cc,1.5); dl.position.set(-20,35,30); dl.castShadow=true; S.add(dl);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(100,70),new THREE.MeshStandardMaterial({color:0x263746,roughness:.85}));
floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; S.add(floor);

const G=new THREE.Group(); S.add(G);
const glass=new THREE.MeshPhysicalMaterial({color:0xcdefff,transparent:true,opacity:.19,roughness:.08,metalness:0,side:THREE.DoubleSide,depthWrite:false});
const box=new THREE.Mesh(new THREE.BoxGeometry(25,18,10),glass); box.position.y=9; G.add(box);
const rimMat=new THREE.MeshStandardMaterial({color:0xbfeaff,transparent:true,opacity:.35});
function edge(x,y,z,sx,sy,sz){let m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),rimMat);m.position.set(x,y,z);G.add(m)}
edge(-12.5,9,0,.25,18,10);edge(12.5,9,0,.25,18,10);edge(0,.15,0,25,.3,10);
const paper=new THREE.Mesh(new THREE.BoxGeometry(22,14,.28),new THREE.MeshStandardMaterial({color:0xf1eee2,roughness:1}));
paper.position.set(0,9,-4.25); G.add(paper);
const waterMat=new THREE.MeshPhysicalMaterial({color:0x3faee0,transparent:true,opacity:.42,roughness:.12});
const water=new THREE.Mesh(new THREE.BoxGeometry(24,1,9),waterMat); water.position.set(0,.65,0); G.add(water);

const seedMat=new THREE.MeshStandardMaterial({color:0xb99255,roughness:.75});
const rootMat=new THREE.MeshStandardMaterial({color:0xf1ead4,roughness:.8});
const stemMat=new THREE.MeshStandardMaterial({color:0x67b84b,roughness:.7});
const leafMat=new THREE.MeshStandardMaterial({color:0x58b947,roughness:.65});
const plants=[];
[-8,-2.7,2.7,8].forEach((x,i)=>{
 const p=new THREE.Group(); p.position.set(x,4,-3.65);
 const seed=new THREE.Mesh(new THREE.SphereGeometry(1.25,20,14),seedMat); seed.scale.set(1.3,.75,.75); p.add(seed);
 const root=new THREE.Mesh(new THREE.CylinderGeometry(.12,.22,1,9),rootMat); root.geometry.translate(0,-.5,0); root.position.y=-.3;p.add(root);
 const stem=new THREE.Mesh(new THREE.CylinderGeometry(.16,.25,1,10),stemMat); stem.geometry.translate(0,.5,0); stem.position.y=.35;p.add(stem);
 const leaf1=new THREE.Mesh(new THREE.SphereGeometry(.65,12,8),leafMat); leaf1.scale.set(.65,.25,1.25); leaf1.position.set(.45,1.2,0);p.add(leaf1);
 const leaf2=leaf1.clone(); leaf2.position.x=-.45; leaf2.rotation.z=.5;p.add(leaf2);
 G.add(p); plants.push({p,root,stem,leaf1,leaf2,lag:i*.5});
});
function update(){
 const d=+day.value, moist=+waterCtl.value/100;
 dayVal.textContent=d.toFixed(1); dayOut.textContent=d.toFixed(1); waterVal.textContent=Math.round(moist*100)+'%';
 water.scale.y=.25+moist*1.3; water.position.y=.2+.35*moist;
 plants.forEach(q=>{
  const t=Math.max(0,d-q.lag-.7), vigor=.35+.65*moist;
  const rootL=Math.min(6,t*1.5)*vigor, stemL=Math.min(9,Math.max(0,t-1)*2)*vigor;
  q.root.scale.y=Math.max(.03,rootL); q.root.visible=t>.05;
  q.stem.scale.y=Math.max(.03,stemL); q.stem.visible=t>.65;
  q.leaf1.visible=q.leaf2.visible=t>2.2;
  const ly=.9+stemL;
  q.leaf1.position.y=q.leaf2.position.y=ly;
  const ls=Math.min(1,Math.max(.1,(t-2.2)/1.6));
  q.leaf1.scale.set(.65*ls,.25*ls,1.25*ls); q.leaf2.scale.copy(q.leaf1.scale);
 });
}
const day=document.getElementById('day'), waterCtl=document.getElementById('water');
const dayVal=document.getElementById('dayVal'),dayOut=document.getElementById('dayOut'),waterVal=document.getElementById('waterVal');
day.oninput=waterCtl.oninput=update;
let playing=false,last=performance.now();
play.onclick=()=>{playing=!playing;play.classList.toggle('on',playing);play.textContent=playing?'⏸ إيقاف':'▶ تشغيل النمو'};
reset.onclick=()=>{day.value=0;playing=false;play.classList.remove('on');play.textContent='▶ تشغيل النمو';update()};
function anim(now){requestAnimationFrame(anim); if(playing){let v=+day.value+(now-last)/2500;if(v>=7){v=7;playing=false;play.classList.remove('on');play.textContent='▶ تشغيل النمو'}day.value=v;update()} last=now; O.update();R.render(S,C)}
update();requestAnimationFrame(anim);
addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});
</script></body></html>
