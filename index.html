<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>متابعة الكيمياء - الوحدة الأولى</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial;background:#f6f6f7;color:#222}
header{background:#b42318;color:#fff;padding:20px 16px}header h1{margin:0;font-size:22px}header p{margin:6px 0 0;font-size:13px;opacity:.9}
main{max-width:900px;margin:auto;padding:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.card,.box{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:15px}.card h2{margin:0;font-size:21px}.small{font-size:12px;color:#667085}
.last{font-weight:700;margin:10px 0;min-height:40px;line-height:1.5}
button,select{font:inherit;border:0;border-radius:10px;padding:11px;font-weight:700}
.red{background:#b42318;color:#fff}.gray{background:#eee;color:#333}.card button{width:100%}
.hidden{display:none}.head{display:flex;align-items:center;gap:10px;margin-bottom:12px}.head h2{flex:1;margin:0}
.box{margin-bottom:12px}.box h3{margin:0 0 12px}select{width:100%;border:1px solid #d0d5dd;background:white;margin-bottom:10px}
.item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #eee}.item:last-child{border:0}
.tick{font-size:18px}.txt{flex:1;font-weight:650}.date{font-size:11px;color:#667085;margin-top:3px}
.del{background:#fee4e2;color:#b42318;padding:7px 9px;font-size:12px}.empty{text-align:center;color:#667085;padding:15px}
.next{background:#fff7ed;border-radius:10px;padding:11px;margin-top:10px;font-size:13px}
</style></head><body>
<header><h1>متابعة صفوف الكيمياء</h1><p>الصف التاسع • الوحدة الأولى: طبيعة المادة</p></header>
<main><section id="home"><div class="grid" id="cards"></div></section>
<section id="classPage" class="hidden">
<div class="head"><button class="gray" onclick="goHome()">رجوع</button><h2 id="classTitle"></h2></div>
<div class="box"><h3>✅ الدروس الفرعية التي خلصتها</h3><div id="doneList"></div><div id="nextTopic" class="next"></div></div>
<div class="box"><h3>➕ أضف الدرس الذي خلصته اليوم</h3>
<select id="topicSelect"></select><button class="red" style="width:100%" onclick="addTopic()">إضافة إلى المنجز</button></div>
</section></main>
<script>
const classes=["9/1","9/2","9/3","9/4","9/5","9/6","9/7"];
const topics=["حالات المادة", "التغيرات في الحالة الفيزيائية", "الانصهار والتجمد", "التبخر والغليان والتكثف", "النموذج الجسيمي الحركي للمادة", "أنواع الجسيمات", "تأثير الشوائب على درجات الانصهار والغليان", "منحنيات التبريد والتسخين", "أنواع المخاليط", "المحاليل", "ذوبانية المواد الصلبة في السوائل", "الانتشار في الموائع", "انتشار الغازات", "نقاوة المواد وماهيتها", "فصل المواد وتنقيتها", "فصل المواد الصلبة غير الذائبة عن السوائل", "فصل مخاليط المواد الصلبة", "عمليات الفصل التي تعتمد على الاختلاف في الذوبانية", "فصل المحاليل", "كروماتوجرافيا الورق", "معالجة المياه"];
const KEY="chem9_unit1_headings_v3";
let data=JSON.parse(localStorage.getItem(KEY)||"{}"); classes.forEach(c=>data[c]??=[]);
let current=null;
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function last(c){return data[c].length?data[c][data[c].length-1].topic:"لم يتم تسجيل درس بعد"}
function renderHome(){
 document.getElementById("cards").innerHTML=classes.map(c=>`<div class="card"><h2>${c}</h2>
 <div class="small">آخر درس تم إنجازه</div><div class="last">${last(c)}</div>
 <div class="small">عدد الدروس المنجزة: ${data[c].length} من ${topics.length}</div>
 <button class="red" onclick="openClass('${c}')">فتح الصف</button></div>`).join("");
}
function openClass(c){current=c;document.getElementById("home").classList.add("hidden");document.getElementById("classPage").classList.remove("hidden");renderClass()}
function goHome(){current=null;document.getElementById("classPage").classList.add("hidden");document.getElementById("home").classList.remove("hidden");renderHome()}
function renderClass(){
 document.getElementById("classTitle").textContent=current;
 const arr=data[current];
 document.getElementById("doneList").innerHTML=arr.length?arr.map((x,i)=>`<div class="item"><span class="tick">✓</span><div class="txt">${x.topic}<div class="date">${x.date}</div></div><button class="del" onclick="removeTopic(${i})">حذف</button></div>`).join(""):`<div class="empty">ما سجلت أي درس لهذا الصف بعد.</div>`;
 const done=new Set(arr.map(x=>x.topic)); const remaining=topics.filter(t=>!done.has(t));
 document.getElementById("topicSelect").innerHTML=remaining.length?remaining.map(t=>`<option>${t}</option>`).join(""):`<option>تم إنهاء جميع عناوين الوحدة</option>`;
 document.getElementById("nextTopic").innerHTML=remaining.length?`<b>التالي حسب ترتيب الكتاب:</b> ${remaining[0]}`:"🎉 تم تسجيل جميع عناوين الوحدة.";
}
function addTopic(){
 const s=document.getElementById("topicSelect"); if(!s.value||s.value==="تم إنهاء جميع عناوين الوحدة")return;
 if(data[current].some(x=>x.topic===s.value))return;
 const d=new Date(); const date=d.toLocaleDateString("ar-OM");
 data[current].push({topic:s.value,date}); save(); renderClass(); renderHome();
}
function removeTopic(i){if(confirm("حذف هذا الدرس من المنجز؟")){data[current].splice(i,1);save();renderClass();renderHome()}}
renderHome();
</script></body></html>
